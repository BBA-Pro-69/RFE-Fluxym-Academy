<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Invoicing Academy | Fluxym</title>
    <!-- Importation des polices Fluxym (Miriam Libre pour les titres, Inter/Source Sans pour le texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Miriam+Libre:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/favicon-Fluxym-V2.png" sizes="32x32" />
    
    <style>
        :root {
            /* === CHARTE GRAPHIQUE FLUXYM === */
            --fluxym-navy: #0B2046;      /* Bleu nuit profond Fluxym */
            --fluxym-cyan: #00A7E1;      /* Cyan vibrant Fluxym */
            --fluxym-cyan-hover: #008ebd;
            --fluxym-light-blue: #E6F6FA; /* Fond bleuté très léger */
            --text-main: #2D3748;
            --text-muted: #718096;
            --bg-body: #F7FAFC;
            --border-color: #E2E8F0;
            --white: #FFFFFF;
            
            /* Polices */
            --font-title: 'Miriam Libre', sans-serif;
            --font-text: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-text);
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER FLUXYM --- */
        header {
            background-color: var(--fluxym-navy);
            color: var(--white);
            padding: 4rem 2rem 5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Effet graphique subtil en fond de header */
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -10%;
            width: 50%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 167, 225, 0.15) 0%, transparent 70%);
            transform: rotate(-45deg);
            pointer-events: none;
        }

        .logo-text {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--fluxym-cyan);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        /* Triangle Fluxym stylisé en CSS pur */
        .fluxym-triangle {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid var(--fluxym-cyan);
        }

        header h1 {
            font-family: var(--font-title);
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--white);
        }

        header p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #A0AEC0;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- CONTAINER & CARDS --- */
        .container {
            max-width: 1100px;
            margin: -3rem auto 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 800px) {
            .container {
                grid-template-columns: 1fr 1.1fr;
            }
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(11, 32, 70, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 15px 35px rgba(11, 32, 70, 0.08);
        }

        .card-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h2 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: var(--fluxym-navy);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-wrapper {
            background-color: var(--fluxym-light-blue);
            color: var(--fluxym-cyan);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* --- FORMULAIRE --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--fluxym-navy);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-text);
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--white);
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            -webkit-appearance: none; /* Améliore le select sur Safari/iOS */
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--fluxym-cyan);
            box-shadow: 0 0 0 3px rgba(0, 167, 225, 0.15);
        }
        
        select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230B2046' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }

        /* --- BOUTON FLUXYM --- */
        .btn {
            display: block;
            width: 100%;
            padding: 1.1rem;
            background-color: var(--fluxym-cyan);
            color: var(--white);
            border: none;
            border-radius: 50px; /* Forme "Pill" typique web moderne */
            font-family: var(--font-text);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2.5rem;
            box-shadow: 0 4px 15px rgba(0, 167, 225, 0.3);
            text-align: center;
        }

        .btn:hover {
            background-color: var(--fluxym-cyan-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 167, 225, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* --- ZONE PÉDAGOGIQUE --- */
        .pedagogy {
            background-color: var(--white);
        }

        .badge {
            display: inline-block;
            background-color: var(--fluxym-light-blue);
            color: var(--fluxym-cyan);
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .theory-title {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--fluxym-navy);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .theory-content p {
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .theory-content strong {
            color: var(--fluxym-navy);
            font-weight: 600;
        }

        /* --- INFO BOX (Résumé config) --- */
        .info-box {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--fluxym-navy);
            padding: 1.2rem;
            border-radius: 8px;
            margin-top: 1.5rem;
        }
        
        .info-box h4 {
            font-family: var(--font-title);
            color: var(--fluxym-navy);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .info-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* --- SUCCESS MESSAGE --- */
        .success-msg {
            display: none;
            margin-top: 1.5rem;
            padding: 1.2rem;
            background-color: #F0FFF4;
            border: 1px solid #9AE6B4;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .success-msg .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .success-msg p {
            color: #276749;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
        }
        
        .success-msg strong {
            display: block;
            margin-top: 0.5rem;
            color: #22543D;
            font-family: monospace;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.5);
            padding: 0.25rem;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Transition douce pour le contenu */
        #theory-content {
            transition: opacity 0.3s ease;
        }
        .main-logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 2rem;
            filter: brightness(0) invert(1); /* Force le logo en blanc pour contraster avec le fond bleu nuit */
        }
    </style>
</head>
<body>

    <header>
        <img src="./assets/fluxym_logo_2018_sansdescriptif_cmyk.png" alt="Fluxym Logo" class="main-logo">
        <h1>E-Invoicing Academy</h1>
        <p>Portail de génération de flux UBL pour validation et intégration Esker.</p>
    </header>

    <div class="container">
        
        <!-- SECTION 1 : THÉORIE -->
        <div class="card pedagogy">
            <div class="card-header">
                <h2><div class="icon-wrapper">📚</div> Fiche Pédagogique</h2>
            </div>
            <div id="theory-content">
                <!-- Contenu injecté par JS au chargement -->
            </div>
        </div>

        <!-- SECTION 2 : PRATIQUE -->
        <div class="card">
            <div class="card-header">
                <h2><div class="icon-wrapper">⚙️</div> Générateur UBL</h2>
            </div>
            
            <div class="form-group">
                <label for="trigramme">Consultant (Trigramme)</label>
                <input type="text" id="trigramme" placeholder="Ex: BBA" maxlength="3" value="BBA">
            </div>

            <div class="form-group">
                <label for="usecase">Cas d'Usage FNFE</label>
                <select id="usecase" onchange="updateInfoBoxWithFade()">
                    <option value="0">Cas 0 : Standard (B2B Domestique)</option>
                    <option value="1">Cas 1 : Multi-commande (3-Way Match)</option>
                    <!-- Les autres cas du PS1 pourront être décommentés ici -->
                    <!-- <option value="2">Cas 2 : Tiers Payeur</option> -->
                    <option value="8">Cas 8 : Affacturage (Créance cédée)</option>
                </select>
            </div>

            <div class="info-box" id="info-box">
                <h4>Paramètres injectés :</h4>
                <p id="info-text">Chargement...</p>
            </div>

            <button class="btn" onclick="generateUBL()">Télécharger la facture (.xml)</button>
            
            <div id="success-msg" class="success-msg">
                <span class="icon">✅</span>
                <p>Génération réussie ! Le fichier a été téléchargé.</p>
                <strong id="filename-display"></strong>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. DONNÉES PÉDAGOGIQUES (Fiches explicatives)
        // ==========================================
        const theoryData = {
            "0": {
                badge: "Cas A1 / Cas 0",
                title: "Le Flux Domestique Standard",
                desc1: "<strong>Scénario :</strong> C'est la facture de référence (B2B domestique). Le fournisseur ACME émet une facture simple à son client KREAMOB, sans commande préalable.",
                desc2: "<strong>Circuit Y-Model :</strong> Fournisseur > PDP Fournisseur > PDP Acheteur > Acheteur.",
                info: "Facture standard (Code 380) - 1 ligne article - TVA 20% - Sans référence commande - Profil S1."
            },
            "1": {
                badge: "Cas A1 - Multi",
                title: "Multi-Commande / 3-Way Match",
                desc1: "<strong>Scénario :</strong> Le fournisseur regroupe plusieurs bons de commande (PO) sur une seule et même facture.",
                desc2: "<strong>Impact Intégration :</strong> Ce fichier est crucial pour valider le 3-Way Match. Esker devra réconcilier les lignes de la facture XML avec les différentes commandes (PO-1001 et PO-1002) dans l'ERP du client.",
                info: "Facture (Code 380) - 3 lignes d'articles - Pointage vers 2 numéros de commandes via &lt;cac:OrderLineReference&gt;."
            },
            "8": {
                badge: "Cas A3 / Cas 8",
                title: "L'Affacturage (Factor)",
                desc1: "<strong>Scénario :</strong> ACME cède sa créance à un organisme d'affacturage. C'est le Factor qui se charge de recouvrer la créance auprès de l'acheteur.",
                desc2: "<strong>Particularité XML :</strong> La facture mentionne explicitement un tiers (le Factor) à qui le paiement doit être adressé.",
                info: "Code 393 (Facture d'affacturage) - Ajout du bloc &lt;cac:PayeeParty&gt; indiquant le paiement à l'ordre de 'ESKER FACTOR'."
            }
        };

        // ==========================================
        // 2. BLOCS XML COMMUNS
        // ==========================================
        const blocPartiesACME = `
\t<cac:AccountingSupplierParty>
\t\t<cac:Party>
\t\t\t<cbc:EndpointID schemeID="0225">331518498</cbc:EndpointID>
\t\t\t<cac:PartyIdentification><cbc:ID schemeID="0009">33151849800001</cbc:ID></cac:PartyIdentification>
\t\t\t<cac:PartyName><cbc:Name>ACME FR</cbc:Name></cac:PartyName>
\t\t\t<cac:PostalAddress><cbc:StreetName>12 Rue de la Republique</cbc:StreetName><cbc:CityName>LYON</cbc:CityName><cbc:PostalZone>69009</cbc:PostalZone><cac:Country><cbc:IdentificationCode>FR</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
\t\t\t<cac:PartyTaxScheme><cbc:CompanyID>FR53331518498</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>
\t\t\t<cac:PartyLegalEntity><cbc:RegistrationName>ACME FR LEGAL</cbc:RegistrationName><cbc:CompanyID schemeID="0002">331518498</cbc:CompanyID></cac:PartyLegalEntity>
\t\t</cac:Party>
\t</cac:AccountingSupplierParty>
\t<cac:AccountingCustomerParty>
\t\t<cac:Party>
\t\t\t<cbc:EndpointID schemeID="0225">333191120</cbc:EndpointID>
\t\t\t<cac:PartyIdentification><cbc:ID schemeID="0009">33319112028662</cbc:ID></cac:PartyIdentification>
\t\t\t<cac:PartyName><cbc:Name>KREAMOB</cbc:Name></cac:PartyName>
\t\t\t<cac:PostalAddress><cbc:StreetName>10 Avenue du Marechal Foch</cbc:StreetName><cbc:CityName>VILLEFRANCHE-SUR-MER</cbc:CityName><cbc:PostalZone>06230</cbc:PostalZone><cac:Country><cbc:IdentificationCode>FR</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
\t\t\t<cac:PartyTaxScheme><cbc:CompanyID>FR12333191120</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>
\t\t\t<cac:PartyLegalEntity><cbc:RegistrationName>KREAMOB Legal entity</cbc:RegistrationName><cbc:CompanyID schemeID="0002">333191120</cbc:CompanyID></cac:PartyLegalEntity>
\t\t</cac:Party>
\t</cac:AccountingCustomerParty>`;

        // ==========================================
        // 3. LOGIQUE D'INTERFACE
        // ==========================================
        
        // Fonction avec effet de fondu pour rendre l'interface plus premium
        function updateInfoBoxWithFade() {
            const theoryContent = document.getElementById('theory-content');
            theoryContent.style.opacity = 0;
            
            setTimeout(() => {
                updateInfoBox();
                theoryContent.style.opacity = 1;
            }, 150);
        }

        function updateInfoBox() {
            const select = document.getElementById('usecase').value;
            const theory = theoryData[select];
            
            if(!theory) return;

            document.getElementById('info-text').innerHTML = theory.info;
            document.getElementById('theory-content').innerHTML = `
                <span class="badge">${theory.badge}</span>
                <h3 class="theory-title">${theory.title}</h3>
                <div class="theory-content">
                    <p>${theory.desc1}</p>
                    <p>${theory.desc2}</p>
                </div>
            `;
            document.getElementById('success-msg').style.display = 'none';
        }

        window.onload = updateInfoBox;


        // ==========================================
        // 4. MOTEUR DE GÉNÉRATION UBL 
        // ==========================================
        function generateUBL() {
            const trigramme = document.getElementById('trigramme').value.toUpperCase() || "UNK";
            const usecase = document.getElementById('usecase').value;
            
            // --- Calcul des dates et numéro de facture ---
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const HH = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            
            const dateStr = `${yy}${MM}${dd}${HH}${mm}${ss}`;
            const numeroFacture = `${trigramme}-${dateStr}`;
            
            const dateFactureXML = `${now.getFullYear()}-${MM}-${dd}`;
            
            const echeance = new Date(now);
            if (["2", "5", "7"].includes(usecase)) {
                echeance.setDate(now.getDate());
            } else {
                echeance.setDate(now.getDate() + 30);
            }
            const dateEcheanceXML = `${echeance.getFullYear()}-${String(echeance.getMonth()+1).padStart(2,'0')}-${String(echeance.getDate()).padStart(2,'0')}`;

            // --- En-tête XML ---
            let invoiceTypeCode = "380";
            if (usecase === "3") invoiceTypeCode = "386";
            if (usecase === "8") invoiceTypeCode = "393";

            let xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2" xmlns:qdt="urn:oasis:names:specification:ubl:schema:xsd:QualifiedDatatypes-2" xmlns:udt="urn:oasis:names:specification:ubl:schema:xsd:UnqualifiedDataTypes-2">
\t<cbc:UBLVersionID>2.1</cbc:UBLVersionID>
\t<cbc:CustomizationID>urn:cen.eu:en16931:2017</cbc:CustomizationID>
\t<cbc:ProfileID>S1</cbc:ProfileID>
\t<cbc:ID>${numeroFacture}</cbc:ID>
\t<cbc:IssueDate>${dateFactureXML}</cbc:IssueDate>
\t<cbc:DueDate>${dateEcheanceXML}</cbc:DueDate>
\t<cbc:InvoiceTypeCode>${invoiceTypeCode}</cbc:InvoiceTypeCode>
\t<cbc:Note>#BAR#B2B</cbc:Note>
\t<cbc:Note>#PMT#Indemnite forfaitaire pour frais de recouvrement : 40 euros.</cbc:Note>
\t<cbc:Note>#PMD#En cas de retard de paiement, des penalites egales a 3 fois le taux d'interet legal seront appliquees.</cbc:Note>
\t<cbc:Note>#AAB#Pas d'escompte pour paiement anticipe.</cbc:Note>
\t<cbc:DocumentCurrencyCode>EUR</cbc:DocumentCurrencyCode>
\t<cbc:TaxCurrencyCode>EUR</cbc:TaxCurrencyCode>
`;

            // --- Injection Tiers ---
            xmlContent += blocPartiesACME + "\n";

            if (usecase === "8") {
                xmlContent += `\t<cac:PayeeParty>
\t\t<cac:PartyIdentification><cbc:ID schemeID="0009">99999999900001</cbc:ID></cac:PartyIdentification>
\t\t<cac:PartyName><cbc:Name>ESKER FACTOR</cbc:Name></cac:PartyName>
\t\t<cac:PartyLegalEntity><cbc:CompanyID schemeID="0002">999999999</cbc:CompanyID></cac:PartyLegalEntity>
\t</cac:PayeeParty>\n`;
            }

            // --- Blocs Totaux et Lignes ---
            if (usecase === "0") {
                xmlContent += `\t<cac:TaxTotal>
\t\t<cbc:TaxAmount currencyID="EUR">200.00</cbc:TaxAmount>
\t\t<cac:TaxSubtotal>
\t\t\t<cbc:TaxableAmount currencyID="EUR">1000.00</cbc:TaxableAmount>
\t\t\t<cbc:TaxAmount currencyID="EUR">200.00</cbc:TaxAmount>
\t\t\t<cac:TaxCategory><cbc:ID>S</cbc:ID><cbc:Percent>20.00</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory>
\t\t</cac:TaxSubtotal>
\t</cac:TaxTotal>
\t<cac:LegalMonetaryTotal>
\t\t<cbc:LineExtensionAmount currencyID="EUR">1000.00</cbc:LineExtensionAmount>
\t\t<cbc:TaxExclusiveAmount currencyID="EUR">1000.00</cbc:TaxExclusiveAmount>
\t\t<cbc:TaxInclusiveAmount currencyID="EUR">1200.00</cbc:TaxInclusiveAmount>
\t\t<cbc:PayableAmount currencyID="EUR">1200.00</cbc:PayableAmount>
\t</cac:LegalMonetaryTotal>
\t<cac:InvoiceLine>
\t\t<cbc:ID>1</cbc:ID>
\t\t<cbc:InvoicedQuantity unitCode="C62">1.00</cbc:InvoicedQuantity>
\t\t<cbc:LineExtensionAmount currencyID="EUR">1000.00</cbc:LineExtensionAmount>
\t\t<cac:Item>
\t\t\t<cbc:Name>Prestation standard sans commande</cbc:Name>
\t\t\t<cac:ClassifiedTaxCategory><cbc:ID>S</cbc:ID><cbc:Percent>20.00</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory>
\t\t</cac:Item>
\t\t<cac:Price><cbc:PriceAmount currencyID="EUR">1000.00</cbc:PriceAmount></cac:Price>
\t</cac:InvoiceLine>`;
            } 
            else if (usecase === "1") {
                xmlContent += `\t<cac:TaxTotal>
\t\t<cbc:TaxAmount currencyID="EUR">650.00</cbc:TaxAmount>
\t\t<cac:TaxSubtotal>
\t\t\t<cbc:TaxableAmount currencyID="EUR">3250.00</cbc:TaxableAmount>
\t\t\t<cbc:TaxAmount currencyID="EUR">650.00</cbc:TaxAmount>
\t\t\t<cac:TaxCategory><cbc:ID>S</cbc:ID><cbc:Percent>20.00</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory>
\t\t</cac:TaxSubtotal>
\t</cac:TaxTotal>
\t<cac:LegalMonetaryTotal>
